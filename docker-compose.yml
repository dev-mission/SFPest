services:
  db:
    image: postgres:17.2
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
  mailcatcher:
    image: dockage/mailcatcher:0.9.0
    ports:
      - 1080:1080
      - 1025:1025
  server:
    build: .
    image: devmission/sfpest:0.1.0
    command: bash -l -c "nf start -j Procfile.dev"
    volumes:
      - .:/opt/node/app
      - /opt/node/app/node_modules
    environment:
      - SMTP_HOST=mailcatcher
      - SMTP_PORT=1025
      - SMTP_USERNAME=none
      - SMTP_PASSWORD=none
      - PORT=3000
      - DATABASE_URL=postgres://postgres@db/sfpest
    ports:
      - 3000:3000
      - 3001:3001
      - 8080:8080
